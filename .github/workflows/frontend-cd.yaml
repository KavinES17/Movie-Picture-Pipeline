name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: frontend
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  IMAGE_TAG: ${{ github.sha }}
  REACT_APP_MOVIE_API_URL: ${{ secrets.BACKEND_URL }}

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" \
            --tag "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            .

      - name: Tag Docker image
        run: |
          docker tag \
            "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Push Docker image
        run: |
          docker push \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"

      - name: Setup Kustomize
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Deploy Kubernetes manifests
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image \
            frontend="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          kustomize build . | kubectl apply -f -

      - name: Verify frontend deployment
        run: |
          echo "=== NODES ==="
          kubectl get nodes -o wide || true

          echo "=== FRONTEND DEPLOYMENT ==="
          kubectl get deployment frontend -o wide || true

          echo "=== FRONTEND PODS ==="
          kubectl get pods -l app=frontend -o wide || true

          echo "=== FRONTEND SERVICE ==="
          kubectl get svc frontend -o wide || true

          echo "=== RECENT EVENTS ==="
          kubectl get events --sort-by=.lastTimestamp | tail -50 || true

          echo "=== ROLLOUT ==="
          kubectl rollout status deployment/frontend --timeout=180s